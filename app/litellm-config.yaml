# Model id strings on Bailian/DashScope shift over time (e.g. the DeepSeek
# V3 family was delisted in favor of V4 in mid-2026). Before the event, open
# the Bailian console -> Model Square and confirm the exact ids below still
# resolve; a wrong id just 404s from litellm and is a one-line fix here.

model_list:
  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: deepseek-v4
    litellm_params:
      model: openai/deepseek-v4
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: glm-4.7
    litellm_params:
      model: openai/glm-4.7
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
