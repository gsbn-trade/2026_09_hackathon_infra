volumes:
  caddy_data:
  caddy_config:
  pg_data:
  openwebui_data:

networks:
  default: {}
  # Created once via `docker network create hackathon_shared` (deploy.sh
  # does this automatically; idempotent) — lets Dify's separately-deployed
  # compose project (see dify/) reach postgres/litellm by name without
  # merging the two compose projects into one.
  hackathon_shared:
    external: true
