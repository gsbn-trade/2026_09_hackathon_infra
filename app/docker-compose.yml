    volumes:
      - ./deepseek-harness/home-team4:/data/.dsh
      - ./deepseek-harness/workspace-team4:/workspace
      - ../data:/workspace/data:ro

  deepseek-harness-team4-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:deepseek-harness-team4"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - deepseek-harness-team4

  deepseek-harness-team5:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM5_DSH_VIRTUAL_KEY}
