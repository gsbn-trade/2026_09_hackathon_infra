name: hackathon

services:
  # Only needed where there's a real domain to get a cert for. Activated by
  # setting COMPOSE_PROFILES=cloud in .env (see .env.example) — locally, plain
  # `docker compose up -d` skips it and docker-compose.override.yml exposes
  # litellm/boltdiy on host ports directly instead (browsers treat
  # http://localhost as a secure context on its own, no TLS needed).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["cloud"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # bcrypt password hashes for each subdomain's HTTP Basic Auth, read into
    # Caddyfile via its {$VAR} substitution syntax — see ./Caddyfile and
    # scripts/generate-team-auth.sh (generates the passphrase + hash pair
    # for each team, writes the hash half here, keeps the plaintext half out
    # of git). Team0 = organizer testing only; its containers aren't started
    # by a plain `docker compose up -d` (see boltdiy-team0 below), but the
    # Caddy route/credential can exist harmlessly either way — an unstarted
    # backend just 502s.
    environment:
      TEAM0_BASIC_AUTH_HASH: ${TEAM0_BASIC_AUTH_HASH}
      TEAM1_BASIC_AUTH_HASH: ${TEAM1_BASIC_AUTH_HASH}
      TEAM2_BASIC_AUTH_HASH: ${TEAM2_BASIC_AUTH_HASH}
      TEAM3_BASIC_AUTH_HASH: ${TEAM3_BASIC_AUTH_HASH}
      TEAM4_BASIC_AUTH_HASH: ${TEAM4_BASIC_AUTH_HASH}
      TEAM5_BASIC_AUTH_HASH: ${TEAM5_BASIC_AUTH_HASH}
      OPENWEBUI_BASIC_AUTH_HASH: ${OPENWEBUI_BASIC_AUTH_HASH}
    depends_on:
      - litellm
      - boltdiy-team1

  # Plain static file server for data/ over HTTP — internal only (no host
  # port, no Caddy route). Exists specifically so Dify's workflow HTTP
  # Request nodes can fetch a track's brief.md directly: Dify's Code nodes
  # run in a deliberately locked-down sandbox that can't read local files
  # even when a path is mounted into it (confirmed: "operation not
  # permitted" — a seccomp restriction, not a missing-mount problem), so
  # this is the actual working path, not a workaround-of-convenience.
  data-server:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../data:/usr/share/nginx/html:ro
      - ./data-server.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hackathon_shared

  # pgvector/pgvector:pg16 is a drop-in-compatible build of postgres:16 with
  # the pgvector extension added — same PGDATA format, existing data/volume
  # untouched by this image swap. Reused for Dify's relational DB *and*
  # vector store (a second "dify" database on this same server, with the
  # extension enabled in it) instead of running Dify's own bundled Postgres
  # + vector-store containers — see dify/README.md.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Reachable from the separately-deployed Dify compose project (see
    # dify/) on this external network, in addition to this project's own
    # default network. Created once via `docker network create
    # hackathon_shared` (deploy.sh does this automatically; idempotent).
    networks:
      - default
      - hackathon_shared

  # litellm-database (not plain litellm) is the variant wired for Postgres —
  # it's what persists teams/virtual-keys/spend across restarts instead of
  # only reading the static model_list from config.yaml.
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    expose:
      - "4000"
    # Reachable from Dify (separate compose project, see dify/) as its
    # model provider — same shared-network pattern as postgres above.
    networks:
      - default
      - hackathon_shared

  # Custom-built from the published bolt.diy image (see Dockerfile.boltdiy) —
  # bakes in two source patches (locks the provider dropdown to just
  # OpenAI-Like; makes it read real per-model token limits from LiteLLM
  # instead of hardcoding 8000 for everything) and pre-installs wrangler, so
  # none of that has to happen at container start anymore. See
  # docs/bolt-provider-lock/README.md for the full why.
  #
  # One instance per team (team0 = organizer testing only — see its
  # `profiles` line below), each byte-for-byte the same build, differing
  # only in which LiteLLM virtual key is baked into its environment: a
  # leaked or misused key only spends that one team's budget, never anyone
  # else's, and a team pasting a wrong key into a shared login is a support
  # ticket at the worst possible moment (kickoff) — baking each team's key
  # into its own container removes that failure mode entirely. Caddy (see
  # ./Caddyfile) routes buildN.<domain> to each, gated by HTTP Basic
  # Auth (username "teamN") since these are public, internet-reachable URLs
  # handed to people this project has no accounts for.
  boltdiy-team0:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    # Organizer testing only. Deliberately NOT part of the default profile
    # set, so a plain `docker compose up -d` (what deploy.sh runs) never
    # starts this — zero CPU/RAM/LLM-budget cost during the event itself.
    # Start it on demand to test before/after the event:
    #   docker compose --profile organizer up -d boltdiy-team0 deepseek-harness-team0 deepseek-harness-team0-proxy
    # and stop it the same way (`... stop` or `... down`) when done.
    profiles: ["organizer"]
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM0_VIRTUAL_KEY}
    # Hard memory ceiling, on top of NODE_OPTIONS' V8 heap cap above — stops
    # one team's heavy generation from pressuring the whole host (and every
    # other team's container on it) instead of just that one container.
    # Reliability over efficiency, per this deployment's own priorities.
    mem_limit: "4g"
    expose:
      - "5173"

  boltdiy-team1:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      # wrangler pages dev (the actual server) is itself a Node process
      # with Node's default V8 heap ceiling — a chat response that
      # generates several files was enough to OOM it under the default,
      # crashing the container (browser saw a bare "network error" because
      # the backend process died mid-request, not a real network issue).
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Single custom OpenAI-compatible slot, pointed at our own gateway.
      # LiteLLM is what actually fans this out to Qwen/Kimi/DeepSeek —
      # bolt.diy just sees one endpoint and a model-name dropdown.
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM1_VIRTUAL_KEY}
    mem_limit: "4g"
    expose:
      - "5173"

  boltdiy-team2:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM2_VIRTUAL_KEY}
    mem_limit: "4g"
    expose:
      - "5173"

  boltdiy-team3:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM3_VIRTUAL_KEY}
    mem_limit: "4g"
    expose:
      - "5173"

  boltdiy-team4:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM4_VIRTUAL_KEY}
    mem_limit: "4g"
    expose:
      - "5173"

  boltdiy-team5:
    build:
      context: .
      dockerfile: Dockerfile.boltdiy
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      NODE_ENV: production
      PORT: "5173"
      RUNNING_IN_DOCKER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      OPENAI_LIKE_API_BASE_URL: http://litellm:4000/v1
      OPENAI_LIKE_API_KEY: ${TEAM5_VIRTUAL_KEY}
    mem_limit: "4g"
    expose:
      - "5173"

  # Code-execution backend for Open WebUI's interpreter — its own built-in
  # (Pyodide) interpreter runs client-side in-browser and can't see server
  # files, so real pandas-on-the-data-folder work needs an actual kernel.
  # Never exposed to participants directly (no Caddy route, no host port in
  # prod) — Open WebUI proxies to it server-to-server on the internal
  # network only. scipy-notebook (not minimal-notebook) so pandas/numpy/
  # matplotlib are already there — every track's data is CSV.
  jupyter:
    image: jupyter/scipy-notebook:latest
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    volumes:
      - ../data:/home/jovyan/data:ro
    expose:
      - "8888"

  # Data understanding/analysis tool — chat UI + Jupyter-backed code
  # interpreter, same LiteLLM gateway as bolt.diy. /home/jovyan/data (via
  # the jupyter service) has every track's brief + CSVs mounted read-only,
  # so any team can pd.read_csv() their assigned track without uploading
  # anything — teams don't know their track assignment ahead of time, and
  # the files are small enough it's simplest to just give everyone all of
  # them.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - litellm
      - jupyter
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_VIRTUAL_KEY}
      ENABLE_CODE_INTERPRETER: "True"
      CODE_EXECUTION_ENGINE: jupyter
      CODE_EXECUTION_JUPYTER_URL: http://jupyter:8888
      CODE_EXECUTION_JUPYTER_AUTH: token
      CODE_EXECUTION_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}
      CODE_EXECUTION_JUPYTER_TIMEOUT: "60"
      CODE_INTERPRETER_ENGINE: jupyter
      CODE_INTERPRETER_JUPYTER_URL: http://jupyter:8888
      CODE_INTERPRETER_JUPYTER_AUTH: token
      CODE_INTERPRETER_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}
      CODE_INTERPRETER_JUPYTER_TIMEOUT: "60"
      # Code Interpreter is a per-chat manual toggle in Open WebUI, off by
      # default, with no config path to default it on — confirmed the hard
      # way (backend config, model capability declarations, and user
      # settings all checked; none of them affect it, and neither does the
      # model actually having the capability — same is true for Web Search
      # and Image Generation, so this looks like a deliberate opt-in-per-
      # message design, not a bug). This banner is the mitigation: an
      # in-app reminder shown to everyone, since a README note alone won't
      # reach participants mid-hackathon.
      WEBUI_BANNERS: >-
        [{"id": "code-interpreter-reminder", "type": "info",
        "title": "Before asking about your data",
        "content": "Click the **Code Interpreter** toggle (in the tools menu next to the message box) at the start of each new chat — it defaults off and does not carry over from previous chats. Without it, questions about files in ~/data will fail.",
        "dismissible": true, "timestamp": 1787942400}]
      # Open WebUI's built-in default prompt tells the model the interpreter
      # "runs directly in the user's browser" — true for the Pyodide engine,
      # false for ours (a real server-side Jupyter kernel), and it never
      # mentions mounted server directories at all for the Jupyter case (that
      # guidance only gets appended for Pyodide, per Open WebUI's own source).
      # Left as-is, the model reasons "the sandbox can't see the user's local
      # ~/data" and refuses without ever trying — confirmed via a real chat's
      # own recorded reasoning trace. This override keeps every instruction
      # that makes execution actually trigger, fixing only the wrong/missing
      # parts.
      CODE_INTERPRETER_PROMPT_TEMPLATE: |
        #### Code Interpreter

        You have access to a Python code interpreter via: `<code_interpreter type="code" lang="python"></code_interpreter>`

        - This runs in a real, persistent Python (Jupyter) kernel on the server — not a browser sandbox, and not isolated from server-side files.
        - A read-only directory of hackathon track data is mounted at `~/data` (i.e. `/home/jovyan/data`) — every track's brief.md plus its CSV/JSON files are there. Never assume a file is inaccessible: run `import os; os.listdir(os.path.expanduser('~/data'))` first to see what's actually there.
        - You can use a wide array of libraries for data manipulation, visualization, API calls, or any computational task. Think outside the box and harness Python's full potential.
        - **You must enclose your code within `<code_interpreter type="code" lang="python">` XML tags** and stop right away. If you don't, the code won't execute.
        - Do NOT use triple backticks (```py ... ```) inside the XML tags — that is markdown formatting, not executable Python code.
        - **Always print meaningful outputs** (results, tables, summaries, visuals). Avoid implicit outputs; use explicit print statements.
        - After obtaining output, **provide a concise analysis, interpretation, or next steps** to help the user understand the findings.
        - If results are unclear or unexpected, refine the code and re-execute. Iterate until you deliver meaningful insights.
        - **If a link to an image, audio, or any file appears in the output, display it exactly as-is** in your response so the user can access it. Do not modify the link.
        - **This is not optional, and describing the image in words is not a substitute: the user cannot see anything you don't literally paste into your reply.** The chat UI does not automatically show the interpreter's own output panel — if you don't copy the `![Output Image](/api/v1/files/.../content)` markdown into your final answer, verbatim, the user sees text only and no chart at all, even though you generated one. Copy it exactly as it appeared in the tool result; do not paraphrase, rename, or describe it as already visible.
        - Example of correct behavior — if the code's output included `result: "![Output Image](/api/v1/files/abc123/content)"`, your reply must contain that literal line, e.g.:
          "Here's the distribution:

          ![Output Image](/api/v1/files/abc123/content)

          The data is right-skewed, with..."
        - Respond in the chat's primary language. Default to English if multilingual.

        Ensure the code interpreter is effectively utilized to achieve the highest-quality analysis for the user.
      # Open WebUI's own accounts/chat history/settings — separate from
      # LiteLLM's Postgres, this is its own SQLite via the volume below.
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      # No per-participant signup/login — matches bolt.diy's "just open the
      # URL" pattern. Only takes effect on a genuinely fresh instance (no
      # existing users) — confirmed working against ours before relying on
      # it, since this flag has a history of not fully applying in some
      # versions/setups.
      WEBUI_AUTH: "False"
    volumes:
      - openwebui_data:/app/backend/data
    expose:
      - "8080"

  # Research/build agent, npm-installed (not built from source — see
  # Dockerfile). Same litellm gateway as the other apps, different virtual
  # key per team. No ports/networks of its own on purpose: dsh's web server
  # refuses to bind anything but 127.0.0.1 inside its own container (a
  # deliberate upstream safety choice — a session gets real bash/filesystem
  # access with only a click-to-approve gate, no login wall of its own), so
  # each team's own -proxy sidecar below is what makes it reachable at all —
  # see docs/deepseek-harness/README.md.
  #
  # One instance per team (team0 = organizer testing only, same `profiles`
  # pattern as boltdiy-team0 above), each with its own home-teamN/
  # (settings/session state) and workspace-teamN/ (agent's read-write
  # working directory) bind mount so agent sessions and generated files
  # never leak between teams — seed a new team's home dir once with
  # `cp -r deepseek-harness/home/settings.yaml deepseek-harness/home/.agent-presets deepseek-harness/home-teamN/`
  # (see README's "Scaling to 5 teams" section).
  #
  # UPDATED RISK NOTE (now exposed via Caddy, not local-only): the
  # DSH_PERMISSION_MODE=danger-full-access reasoning below ("this container
  # is already the actual security boundary... danger-full-access doesn't
  # change that blast radius") was written when this was local-only/
  # loopback-only. It's now reachable over the public internet by anyone
  # holding that team's Basic Auth passphrase (see ./Caddyfile) — which
  # means every member of a team, sharing one passphrase, gets real
  # bash/filesystem access *inside that team's own container* (never another
  # team's, never the host) behind only a click-to-approve prompt. That's
  # the accepted trade for exposing dsh at all: contain it per-team
  # (separate container, separate credential, separate bind mounts) rather
  # than not exposing it — matches upstream's own guidance to "prefer a
  # disposable virtual machine, container, or dedicated environment," which
  # is exactly what each team gets here.
  deepseek-harness-team0:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    # Organizer testing only — see boltdiy-team0's comment above for the
    # exact command to start/stop this on demand.
    profiles: ["organizer"]
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM0_DSH_VIRTUAL_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_PERMISSION_MODE: danger-full-access
    mem_limit: "1g"
    volumes:
      - ./deepseek-harness/home-team0:/data/.dsh
      - ./deepseek-harness/workspace-team0:/workspace
      - ../data:/workspace/data:ro

  deepseek-harness-team0-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["organizer"]
    network_mode: "service:deepseek-harness-team0"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - deepseek-harness-team0

  deepseek-harness-team1:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM1_DSH_VIRTUAL_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_PERMISSION_MODE: danger-full-access
    mem_limit: "1g"
    volumes:
      - ./deepseek-harness/home-team1:/data/.dsh
      - ./deepseek-harness/workspace-team1:/workspace
      - ../data:/workspace/data:ro

  # Sidecar proxy sharing deepseek-harness-teamN's network namespace
  # (Compose's network_mode: "service:<name>") — the only way to reach dsh's
  # loopback-only web server from outside its own container at all, let
  # alone from another container. Listens on every interface *inside that
  # shared namespace* on :8080 (see deepseek-harness/Caddyfile); Caddy (the
  # top-level one, ./Caddyfile) reaches it at deepseek-harness-teamN:8080 —
  # the *owner* service's name, since the proxy container joins that
  # namespace rather than getting a network identity of its own.
  deepseek-harness-team1-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:deepseek-harness-team1"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - deepseek-harness-team1

  deepseek-harness-team2:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM2_DSH_VIRTUAL_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_PERMISSION_MODE: danger-full-access
    mem_limit: "1g"
    volumes:
      - ./deepseek-harness/home-team2:/data/.dsh
      - ./deepseek-harness/workspace-team2:/workspace
      - ../data:/workspace/data:ro

  deepseek-harness-team2-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:deepseek-harness-team2"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - deepseek-harness-team2

  deepseek-harness-team3:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM3_DSH_VIRTUAL_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_PERMISSION_MODE: danger-full-access
    mem_limit: "1g"
    volumes:
      - ./deepseek-harness/home-team3:/data/.dsh
      - ./deepseek-harness/workspace-team3:/workspace
      - ../data:/workspace/data:ro

  deepseek-harness-team3-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:deepseek-harness-team3"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - deepseek-harness-team3

  deepseek-harness-team4:
    build:
      context: ./deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      DEEPSEEK_HARNESS_VIRTUAL_KEY: ${TEAM4_DSH_VIRTUAL_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
