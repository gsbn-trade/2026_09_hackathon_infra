      - ../data:/workspace/data:ro

  deepseek-harness-team5-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:deepseek-harness-team5"
    volumes:
      - ./deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
