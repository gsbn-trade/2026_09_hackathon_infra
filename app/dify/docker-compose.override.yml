# Auto-loaded alongside docker-compose.yaml, no flags needed — keeps the
# vendored upstream file pristine (easy `git diff` against a future
# re-vendor) instead of hand-editing it. Same pattern as ../docker-compose.override.yml.
#
# Adds hackathon_shared to every service that needs to reach the main
# stack's Postgres/LiteLLM (api/worker/worker_beat/plugin_daemon need
# Postgres; ssrf_proxy is what actually makes the outbound call to LiteLLM
# on api/worker's behalf; nginx is what the main stack's Caddy reverse-
# proxies to, instead of publishing 80/443 here and conflicting with it).
services:
  api:
    networks:
      - default
      - hackathon_shared
    volumes:
      - ../../data:/hackathon-data:ro

  worker:
    networks:
      - default
      - hackathon_shared
    volumes:
      - ../../data:/hackathon-data:ro

  worker_beat:
    networks:
      - default
      - hackathon_shared

  plugin_daemon:
    networks:
      - default
      - hackathon_shared

  ssrf_proxy:
    networks:
      - default
      - hackathon_shared

  nginx:
    networks:
      - default
      - hackathon_shared
    # No ports: override here — Compose merges (not replaces) list fields
    # across compose files, so a ports: override here would ADD to the base
    # file's 80/443 rather than replace it (confirmed the hard way: still
    # showed 0.0.0.0:80->80 after adding an "override"). EXPOSE_NGINX_PORT
    # in .env is what actually controls this, since the base file's ports:
    # entry is `${EXPOSE_NGINX_PORT:-80}:...` — changing the var sidesteps
    # the merge behavior entirely instead of fighting it.

networks:
  hackathon_shared:
    external: true
