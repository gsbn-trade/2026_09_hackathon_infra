# Forces every file under data/ to be served as plain text, regardless of
# extension. Needed because nginx's default mime.types has no entry for
# .md (or our other extensions), so it falls back to
# application/octet-stream — and Dify's HTTP Request node treats any
# non-text content-type as a file attachment rather than populating its
# `body` output as text, silently leaving the fetched content out of an
# LLM prompt (confirmed: status 200, correct content-length, but an empty
# `body` and the real bytes redirected into `files` instead).
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex off;
    # Inside server{}, not top-level — the base image's own nginx.conf
    # already sets default_type at the http{} level this file gets
    # included into, and a second top-level directive here was a "duplicate
    # directive" fatal error (confirmed the hard way, crash-looped).
    default_type text/plain;
}
