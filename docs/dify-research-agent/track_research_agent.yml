app:
  description: 'Template: reads a track''s full brief.md as context (no upload
    needed) and answers a research/product question against it. Duplicate this
    per team and adjust the LLM prompt/model as needed. See docs/dify-research-agent/
    for how this is wired (data-server, HTTP Request node instead of a Code node
    — Code nodes run in a locked-down sandbox that cannot read local files).'
  icon: 🔎
  icon_background: '#E0F2FE'
  mode: workflow
  name: 'Track Research Agent (template)'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: http-request
        id: start-to-http
        source: 'start_node'
        sourceHandle: source
        target: 'http_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: llm
        id: http-to-llm
        source: 'http_node'
        sourceHandle: source
        target: 'llm_node'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: llm-to-end
        source: 'llm_node'
        sourceHandle: source
        target: 'end_node'
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 'Pick your track, then ask a research/market question about it.'
          selected: false
          title: Start
          type: start
          variables:
            - label: Track
              variable: track
              type: select
              required: true
              max_length: null
              options:
                - 'Track 1 - Vessel Schedule'
                - 'Track 2 - Terminal Ops'
                - 'Track 2 - Terminal Ops v2'
                - 'Track 3 - EDI API'
                - 'Track 4 - Transshipment Schedule Visibility'
            - label: Research question
              variable: question
              type: paragraph
              required: true
              max_length: 2000
              options: []
        height: 116
        id: 'start_node'
        position:
          x: 30
          y: 227
        positionAbsolute:
          x: 30
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: no-auth
          body:
            data: ''
            type: none
          desc: 'Fetches the selected track''s full brief.md from data-server (plain
            HTTP, internal-only) — not a Code node: Code nodes run in dify-sandbox,
            which is deliberately locked down and cannot read local files even when
            a path is mounted into it (confirmed: "operation not permitted").'
          headers: ''
          method: GET
          params: ''
          retry_config:
            enabled: false
            exponential_backoff:
              enabled: false
              max_interval: 10000
              multiplier: 2
            max_retries: 1
            retry_interval: 1000
          timeout:
            connect: 10
            read: 30
            write: 30
          title: Fetch brief.md
          type: http-request
          url: 'http://data-server/{{#start_node.track#}}/brief.md'
        height: 90
        id: 'http_node'
        position:
          x: 334
          y: 227
        positionAbsolute:
          x: 334
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          title: Research synthesis
          type: llm
          model:
            provider: 'langgenius/openai_api_compatible/openai_api_compatible'
            name: qwen3.7-plus
            mode: chat
            completion_params:
              temperature: 0.4
          prompt_template:
            - role: system
              text: |-
                You are a market/product research analyst helping a hackathon team
                turn a problem-domain briefing into a concrete product angle.

                You will be given the full field briefing for one track, and a
                specific question from the team. Ground every claim in the briefing
                text provided — do not invent domain facts not present in it. Where
                the question calls for external/market context the briefing doesn't
                cover, say so explicitly rather than guessing.

                Structure your answer as:
                1. Problem summary (2-3 sentences, in your own words)
                2. Direct answer to their question
                3. A concrete, buildable product angle this suggests, sized for a
                   half-day hackathon build in bolt.diy — not a full platform.
            - role: user
              text: |-
                TRACK BRIEFING:
                {{#http_node.body#}}

                QUESTION:
                {{#start_node.question#}}
          vision:
            enabled: false
            configs:
              variable_selector: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          context:
            enabled: false
            variable_selector: []
          structured_output:
            enabled: false
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000
        height: 90
        id: 'llm_node'
        position:
          x: 638
          y: 227
        positionAbsolute:
          x: 638
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - 'llm_node'
                - text
              value_type: string
              variable: answer
          selected: false
          title: End
          type: end
        height: 90
        id: 'end_node'
        position:
          x: 942
          y: 227
        positionAbsolute:
          x: 942
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
